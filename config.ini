# 机器节点域名后缀
domain=k8s.local

# 部署节点主机名及IP地址
node_ip=(192.168.121.11 192.168.121.12 192.168.121.13)
node_hostname=(node1.${domain} node2.${domain} node3.${domain})

# 添加节点主机名及IP地址
addnode_ip=(192.168.121.14 192.168.121.15)
addnode_hostname=(node4.${domain} node5.${domain})

# 部署ssh用户(当前仅支持root)、端口、私钥
ssh_user=root
ssh_port=22
ssh_key=~/.ssh/id_ed25519

# kube-proxy网络模式: iptables、nftables(kernel >= 5.13)、ipvs
kubeproxy_mode=iptables

# 外部ntp服务器(可选)
# 已设置: 所有节点从该服务器同步时间
# 留空:   第一个节点作为集群内时间源，其余节点从其同步
ntp_server=

# bootstrap token: 留空时首次 install 自动生成随机 token 并持久化到 pki/kube_token(addnode 复用)
kube_token=

# 集群网络配置(构建期写入 yaml, 部署期写入组件配置, 三处必须一致)
service_cidr=10.96.0.0/16
cluster_dns=10.96.0.10
cluster_cidr=10.244.0.0/16
cluster_domain=cluster.local

# 物理架构：x86_64、aarch64
# build.sh可通过参数覆盖，如 ./build.sh aarch64
arch=${arch:-x86_64}

# 运行和打包路径(部署机本地工作目录)
run_path=${PWD}
pkg_path=${run_path}/pkg
pki_path=${run_path}/pki

# 节点安装路径
bin_path=/usr/local/bin
conf_path=/etc/kubernetes
cert_path=/etc/kubernetes/pki
systemd_path=/etc/systemd/system
etcd_data_path=/var/lib/etcd
registry_data_path=/var/lib/registry

# local-path provisioner数据存储路径
data_path=/data

# 组件版本
cfssl_version=1.6.5
etcd_version=3.6.15
nerdctl_version=2.3.5
kubernetes_version=1.35.9
metrics_version=0.9.0
localpath_version=0.0.36
registry_version=3.1.2
haproxy_version=3.2.16
pause_version=3.10.1
k9s_version=0.51.0
calico_version=3.32.2


# 架构名称
if [ ${arch} == "x86_64" ]; then
    arch_name=amd64
elif [ ${arch} == "aarch64" ]; then
    arch_name=arm64
else
    echo "arch error, only support x86_64 and aarch64"
    exit 1
fi

# 二进制文件及网络地址
cfssl_file="cfssl_${cfssl_version}_linux_${arch_name}"
cfssl_url="https://github.com/cloudflare/cfssl/releases/download/v${cfssl_version}/${cfssl_file}"
cfssljson_file="cfssljson_${cfssl_version}_linux_${arch_name}"
cfssljson_url="https://github.com/cloudflare/cfssl/releases/download/v${cfssl_version}/${cfssljson_file}"
etcd_file="etcd-v${etcd_version}-linux-${arch_name}.tar.gz"
etcd_url="https://github.com/etcd-io/etcd/releases/download/v${etcd_version}/${etcd_file}"
nerdctl_file="nerdctl-full-${nerdctl_version}-linux-${arch_name}.tar.gz"
nerdctl_url="https://github.com/containerd/nerdctl/releases/download/v${nerdctl_version}/${nerdctl_file}"
kubernetes_file="kubernetes-server-linux-${arch_name}.tar.gz"
kubernetes_url="https://dl.k8s.io/v${kubernetes_version}/${kubernetes_file}"
k9s_file="k9s_Linux_${arch_name}.tar.gz"
k9s_url="https://github.com/derailed/k9s/releases/download/v${k9s_version}/${k9s_file}"

# yaml文件及网络地址
coredns_file="coredns.yaml"
coredns_url="https://raw.githubusercontent.com/kubernetes/kubernetes/refs/tags/v${kubernetes_version}/cluster/addons/dns/coredns/coredns.yaml.base"
localpath_file="local-path.yaml"
localpath_url="https://raw.githubusercontent.com/rancher/local-path-provisioner/v${localpath_version}/deploy/local-path-storage.yaml"
metrics_file="metrics-server.yaml"
metrics_url="https://github.com/kubernetes-sigs/metrics-server/releases/download/v${metrics_version}/components.yaml"
calico_file="calico.yaml"
calico_url="https://raw.githubusercontent.com/projectcalico/calico/v${calico_version}/manifests/calico.yaml"

# 镜像文件及网络地址
registry_file="registry.tar"
registry_image="docker.io/library/registry:${registry_version}"
haproxy_file="haproxy.tar"
haproxy_image="docker.io/library/haproxy:${haproxy_version}"
pause_image="registry.k8s.io/pause:${pause_version}"
image_file="image-registry.tar.gz"

# 系统依赖离线下载容器镜像 (build.sh make_deps 使用)
# 可通过修改版本号适配不同基础镜像
deps_rhel_image="rockylinux/rockylinux:9"
deps_deb_image="debian:12"

# 镜像代理配置
# registry_proxy=m.daocloud.io
