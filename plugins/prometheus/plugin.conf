# shellcheck shell=bash
# prometheus 插件元数据(版本号由构建期写入)
plugin_name=prometheus
plugin_version=__PLUGIN_VERSION__
plugin_description="kube-prometheus-stack: Prometheus/Alertmanager/Grafana/node-exporter"
plugin_namespace=monitoring

# manifest 应用顺序: CRD 先行, 引擎对含 CustomResourceDefinition 的文件等待 Established
plugin_manifests=(00-crds.yaml 10-stack.yaml)
