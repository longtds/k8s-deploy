# kube-prometheus-stack helm 渲染参数
# 构建期由 lib/build-plugins.sh 执行 helm template 渲染为静态 yaml 并改写镜像到本地 registry。
# 资源请求按 3 节点 4C4G 测试环境下调; 持久化显式使用集群内置 local-path StorageClass。
fullnameOverride: kps

# ---------------------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi

# ---------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 2Gi

# ---------------------------------------------------------------------------
# Grafana (ClusterIP, 通过 kubectl port-forward 访问)
# ---------------------------------------------------------------------------
grafana:
  adminUser: admin
  # 初始口令, 登录后请立即修改
  adminPassword: prom-operator
  defaultDashboardsTimezone: browser
  service:
    type: ClusterIP
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# ---------------------------------------------------------------------------
# operator / 采集组件资源下调
# ---------------------------------------------------------------------------
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeExporter:
  resources:
    requests:
      cpu: 20m
      memory: 50Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
