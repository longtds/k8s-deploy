# loki-stack helm 渲染参数
# 构建期由 lib/build-plugins.sh 执行 helm template 渲染为静态 yaml 并改写镜像到本地 registry。
# 独立 logging 命名空间(不与 prometheus 插件共用, 卸载互不影响); 持久化使用集群内置 local-path。
test:
  enabled: false

loki:
  enabled: true
  isDefault: true
  # 显式对齐 loki/promtail 版本(chart 内置默认偏旧且两者不匹配)
  image:
    tag: 2.9.3
  # 单体模式, 数据落盘 local-path PVC
  persistence:
    enabled: true
    storageClassName: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # 单体模式无需多副本告警
  replicas: 1

promtail:
  enabled: true
  image:
    tag: 2.9.3
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  enabled: false
