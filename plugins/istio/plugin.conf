# shellcheck shell=bash
# istio 插件元数据(版本号由构建期写入)
plugin_name=istio
plugin_version=__PLUGIN_VERSION__
plugin_description="istio: 服务网格(istiod + ingress gateway, sidecar 模式)"
plugin_namespace=istio-system

# base 渲染产物拆出 CRD 先行; istiod/gateway 无 CRD
plugin_manifests=(00-crds.yaml 10-base.yaml 11-istiod.yaml 12-gateway.yaml)
