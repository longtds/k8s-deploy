# higress helm 渲染参数。
# higress 父 chart 为 umbrella, 子 chart higress-core / higress-console 的参数
# 按子 chart 名做嵌套命名空间。构建期由 lib/build-plugins.sh 执行 helm template
# 渲染为静态 yaml 并改写镜像到本地 registry(Placeholder_registry)。
#
# 互斥说明: higress 与 istio 插件互斥 —— 两者同属 istio 控制面体系, 且都声明
# envoyfilters.networking.istio.io CRD, 共存会互相覆盖/删除该 CRD 导致故障。
# 引擎的 plugin_pre_install 钩子在 hooks.sh 中做前置拦截。

higress-core:
  gateway:
    # 默认 2 副本 + LoadBalancer, 离线/无 LB 集群下不可用; 单副本 + NodePort 更实用
    replicas: 1
    service:
      type: NodePort
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  controller:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  pilot:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

higress-console:
  # 内置可观测栈(grafana/prometheus/loki)保持关闭, 避免与 prometheus 插件重复部署
  o11y:
    enabled: false
  # admin 口令必须显式设置: chart 仅在设置了口令时才渲染 secret 的
  # adminUsername/adminPassword/key/iv, 留空会导致 console 无有效管理员配置而无法登录
  admin:
    username: admin
    password: higress
  # 资源请求下调适配小规格节点
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
